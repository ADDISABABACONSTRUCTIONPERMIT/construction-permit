<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Construction Permit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: auto !important;
      min-height: 100vh;
      background-color: #000;
      overflow-y: scroll !important;
      -webkit-overflow-scrolling: touch;
    }
    .image-container {
      width: 100%;
      height: auto;
      display: block;
      padding-bottom: 80px; /* Ensures the bottom footer is fully readable */
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="image-container">
    <img src="https://iili.io/n4TI8np.jpg" alt="Construction Permit">
  </div>
</body>
</html>
