  <span style="color: #e74c3c; font-weight: bold;">
  <script>
    // Wait 3 seconds after the page loads, then wipe out the content to simulate a network drop
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        document.body.innerHTML = `
          <div style="font-family: sans-serif; text-align: center; margin-top: 35vh; padding: 20px;">
            <h2 style="color: #333;">⚠️ Network Error</h2>
            <p style="color: #666; font-size: 16px;">The connection was lost while loading the document. Please check your signal and try again.</p>
          </div>
        `;
      }, 3000); // 3000 milliseconds = 3 seconds
    });
  </script>
  </span>
</body>
